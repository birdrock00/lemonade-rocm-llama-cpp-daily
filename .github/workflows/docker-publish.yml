name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: release-date
        run: |
          echo "UTC_TIMESTAMP=$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_ENV"
          echo "tag=$(date -u +'%m-%d-%Y')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image for x86_64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/birdrock00/lemonade-rocm-llama-cpp-daily:latest
            ghcr.io/birdrock00/lemonade-rocm-llama-cpp-daily:${{ env.UTC_TIMESTAMP }}
            ghcr.io/birdrock00/lemonade-rocm-llama-cpp-daily:${{ steps.release-date.outputs.tag }}

      - name: Create release for daily image
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: image-${{ steps.release-date.outputs.tag }}-${{ github.run_id }}
          name: Container image ${{ steps.release-date.outputs.tag }}
          body: |
            Container image for ${{ steps.release-date.outputs.tag }}:

            `ghcr.io/birdrock00/lemonade-rocm-llama-cpp-daily:${{ steps.release-date.outputs.tag }}`
          make_latest: true
