name: Build and Push Docker Image

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: release-date
        run: |
          echo "UTC_TIMESTAMP=$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_ENV"
          echo "tag=$(date -u +'%m-%d-%Y')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image for x86_64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/birdrock00/lemonade-rocm-llama-cpp-daily:latest
            ghcr.io/birdrock00/lemonade-rocm-llama-cpp-daily:${{ env.UTC_TIMESTAMP }}
            ghcr.io/birdrock00/lemonade-rocm-llama-cpp-daily:${{ steps.release-date.outputs.tag }}
