name: Build and Push b1253 Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout b1253 branch
        uses: actions/checkout@v4
        with:
          ref: b1253

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release date tag
        id: release-date
        run: echo "tag=$(date -u +'%m-%d-%Y')" >> "$GITHUB_OUTPUT"

      - name: Build and push b1253 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/birdrock00/lemonade-rocm-llama-cpp-daily:b1253
            ghcr.io/birdrock00/lemonade-rocm-llama-cpp-daily:${{ steps.release-date.outputs.tag }}

      - name: Create release for daily image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b1253-image-${{ steps.release-date.outputs.tag }}-${{ github.run_id }}
          name: b1253 container image ${{ steps.release-date.outputs.tag }}
          body: |
            Container image for ${{ steps.release-date.outputs.tag }}:

            `ghcr.io/birdrock00/lemonade-rocm-llama-cpp-daily:${{ steps.release-date.outputs.tag }}`
          make_latest: true
